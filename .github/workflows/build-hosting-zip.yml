name: Build hosting ZIP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-hosting-zip.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Create hosting archive
        run: |
          cd dist
          zip -r ../princessahair-hosting.zip .

      - name: Upload hosting archive
        uses: actions/upload-artifact@v4
        with:
          name: princessahair-hosting
          path: princessahair-hosting.zip
          if-no-files-found: error
          retention-days: 7
